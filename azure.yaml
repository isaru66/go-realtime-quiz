# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: go-realtime-quiz
metadata:
  template: go-realtime-quiz@0.1.0

infra:
  provider: terraform
  path: ./infra

# Create namespace credentials and ingress TLS before deploy; see docs/operations.md.
services:
  backend:
    project: ./src/backend
    host: aks
    docker:
      path: ./Dockerfile
      context: ../..
    k8s:
      namespace: quiz-platform
      kustomize:
        dir: ../../deploy/kubernetes/overlays/development
        edits:
          - "set image quiz-backend=${SERVICE_BACKEND_IMAGE_NAME}"
  frontend:
    project: ./src/frontend
    host: aks
    docker:
      path: ./Dockerfile
    k8s:
      namespace: quiz-platform
      kustomize:
        dir: ../../deploy/kubernetes/overlays/development
        edits:
          - "set image quiz-frontend=${SERVICE_FRONTEND_IMAGE_NAME}"
