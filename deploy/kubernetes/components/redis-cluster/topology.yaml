apiVersion: apps/v1
kind: StatefulSet
metadata: {name: redis}
spec:
  replicas: 6
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: backend}
spec:
  template:
    spec:
      containers:
        - name: backend
          env:
            - {name: REDIS_ADDRS, value: "redis-0.redis:6379,redis-1.redis:6379,redis-2.redis:6379,redis-3.redis:6379,redis-4.redis:6379,redis-5.redis:6379"}
---
apiVersion: batch/v1
kind: Job
metadata: {name: redis-init}
spec:
  template:
    spec:
      containers:
        - name: initialize
          env:
            - {name: REDIS_NODES, value: "redis-0.redis redis-1.redis redis-2.redis redis-3.redis redis-4.redis redis-5.redis"}
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: redis-backup}
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: backup
              env:
                - {name: REDIS_NODES, value: "redis-0.redis redis-1.redis redis-2.redis redis-3.redis redis-4.redis redis-5.redis"}
