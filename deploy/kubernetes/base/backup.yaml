apiVersion: batch/v1
kind: CronJob
metadata: {name: redis-backup}
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 120
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 840
      template:
        metadata:
          labels: {app: redis-backup}
        spec:
          restartPolicy: Never
          serviceAccountName: quiz-runtime
          automountServiceAccountToken: false
          securityContext: {runAsNonRoot: true, runAsUser: 999, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
          containers:
            - name: backup
              image: quiz-redis-backup:latest
              resources:
                requests: {cpu: 100m, memory: 128Mi, ephemeral-storage: 1Gi}
                limits: {cpu: "1", memory: 512Mi, ephemeral-storage: 16Gi}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
              env:
                - {name: REDIS_NODES, value: "redis-0.redis redis-1.redis redis-2.redis redis-3.redis redis-4.redis redis-5.redis"}
                - name: REDIS_PASSWORD
                  valueFrom: {secretKeyRef: {name: quiz-secrets, key: REDIS_PASSWORD}}
                - name: BLOB_CONTAINER_URL
                  valueFrom: {secretKeyRef: {name: backup-storage, key: BLOB_CONTAINER_URL}}
                - name: BLOB_SAS_TOKEN
                  valueFrom: {secretKeyRef: {name: backup-storage, key: BLOB_SAS_TOKEN}}
              volumeMounts:
                - {name: work, mountPath: /work}
                - {name: script, mountPath: /opt/backup, readOnly: true}
          volumes:
            - {name: work, emptyDir: {sizeLimit: 16Gi}}
            - name: script
              configMap: {name: backup-script}
