apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../base]
patches:
  - target: {kind: Deployment, name: backend}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
      spec:
        template:
          spec:
            containers:
              - name: backend
                env:
                  - {name: COOKIE_SECURE, value: "false"}
                  - {name: ALLOWED_ORIGINS, value: "http://localhost:8088,http://localhost:5173"}
