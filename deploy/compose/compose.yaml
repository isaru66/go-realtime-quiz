name: quiz

x-redis: &redis
  image: redis:7.4.7-alpine
  user: redis
  read_only: true
  entrypoint: ["/bin/sh", "/opt/redis/start.sh"]
  environment: &redis-env
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in deploy/compose/.env}
  volumes:
    - ../kubernetes/base/scripts:/opt/redis:ro
  healthcheck:
    test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
    interval: 3s
    timeout: 2s
    retries: 40
    start_period: 5s
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 640m
  cpus: 0.5
  security_opt: ["no-new-privileges:true"]

x-backend: &backend
  build:
    context: ../..
    dockerfile: src/backend/Dockerfile
  environment:
    LISTEN_ADDR: ":8080"
    QUIZ_PATH: /config/quizzes.yaml
    PROTOCOL_SCHEMA_PATH: /app/protocol-v1.schema.json
    REDIS_ADDRS: redis-0:6379,redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379
    REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ADMIN_CREDENTIAL: ${ADMIN_CREDENTIAL:?Set ADMIN_CREDENTIAL}
    APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
    ALLOWED_ORIGINS: http://localhost:8088,http://localhost:5173
    COOKIE_SECURE: "false"
    TRUSTED_PROXIES: 172.30.0.10/32
    REDIS_TLS: "false"
    GAME_IDLE_SECONDS: "${GAME_IDLE_SECONDS:-7200}"
    GAME_LIFETIME_SECONDS: "${GAME_LIFETIME_SECONDS:-86400}"
    RESULT_RETENTION_SECONDS: "${RESULT_RETENTION_SECONDS:-3600}"
    JOIN_RATE_PER_MINUTE: "${JOIN_RATE_PER_MINUTE:-30}"
  volumes: ["../../config:/config:ro"]
  depends_on:
    redis-init: {condition: service_completed_successfully}
  healthcheck:
    test: ["CMD", "/app/server", "-healthcheck"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s
  init: true
  read_only: true
  restart: unless-stopped
  stop_grace_period: 30s
  mem_limit: 512m
  cpus: 1
  security_opt: ["no-new-privileges:true"]

services:
  redis-0:
    <<: *redis
    environment: {<<: *redis-env, REDIS_ANNOUNCE_HOSTNAME: redis-0}
    volumes: ["../kubernetes/base/scripts:/opt/redis:ro", "redis-0:/data"]
  redis-1:
    <<: *redis
    environment: {<<: *redis-env, REDIS_ANNOUNCE_HOSTNAME: redis-1}
    volumes: ["../kubernetes/base/scripts:/opt/redis:ro", "redis-1:/data"]
  redis-2:
    <<: *redis
    environment: {<<: *redis-env, REDIS_ANNOUNCE_HOSTNAME: redis-2}
    volumes: ["../kubernetes/base/scripts:/opt/redis:ro", "redis-2:/data"]
  redis-3:
    <<: *redis
    environment: {<<: *redis-env, REDIS_ANNOUNCE_HOSTNAME: redis-3}
    volumes: ["../kubernetes/base/scripts:/opt/redis:ro", "redis-3:/data"]
  redis-4:
    <<: *redis
    environment: {<<: *redis-env, REDIS_ANNOUNCE_HOSTNAME: redis-4}
    volumes: ["../kubernetes/base/scripts:/opt/redis:ro", "redis-4:/data"]
  redis-5:
    <<: *redis
    environment: {<<: *redis-env, REDIS_ANNOUNCE_HOSTNAME: redis-5}
    volumes: ["../kubernetes/base/scripts:/opt/redis:ro", "redis-5:/data"]
  redis-init:
    image: redis:7.4.7-alpine
    entrypoint: ["/bin/sh", "/opt/redis/initialize.sh"]
    environment:
      <<: *redis-env
      REDIS_NODES: redis-0 redis-1 redis-2 redis-3 redis-4 redis-5
    volumes: ["../kubernetes/base/scripts:/opt/redis:ro"]
    depends_on:
      redis-0: {condition: service_healthy}
      redis-1: {condition: service_healthy}
      redis-2: {condition: service_healthy}
      redis-3: {condition: service_healthy}
      redis-4: {condition: service_healthy}
      redis-5: {condition: service_healthy}
    restart: "no"
    read_only: true
    mem_limit: 128m
    security_opt: ["no-new-privileges:true"]
  backend:
    <<: *backend
    ports: ["127.0.0.1:18080:8080"]
  backend2:
    <<: *backend
    ports: ["127.0.0.1:18081:8080"]
  frontend:
    build: {context: ../../src/frontend}
    ports: ["8088:8080"]
    networks:
      default:
        ipv4_address: 172.30.0.10
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:uid=101,gid=101,mode=1777"]
    stop_grace_period: 15s
    mem_limit: 128m
    cpus: 0.5
    security_opt: ["no-new-privileges:true"]
volumes:
  redis-0:
  redis-1:
  redis-2:
  redis-3:
  redis-4:
  redis-5:
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
